# 每週自動備份 Supabase 資料庫（全部資料表 → JSON），打包後放進 GitHub Releases。
#
# 為什麼放 Releases、不是放 repo 的 backups/ 目錄：
# repo 的 .gitignore 本來就把 backups/ 排除在 git 之外（見 scripts/backup.ps1 的說明），
# 這是既有決定：避免每次備份的資料檔案把 git 歷史越養越大。放 Release 一樣有日期、
# 一樣能下載，又不會讓 repo 大小持續膨脹或讓每週的 commit 記錄塞滿雜訊。
#
# 需要的 GitHub Secrets（Settings → Secrets and variables → Actions → New repository secret）：
#   SUPABASE_URL          Supabase 專案 URL
#   SUPABASE_SERVICE_KEY  service_role secret key（Project Settings → API），會繞過 RLS 讀到全部資料
name: 備份 Supabase 資料

on:
  schedule:
    - cron: '0 18 * * 0' # 每週日 UTC 18:00（台灣時間週一 02:00）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # 公開倉庫的 Releases 任何人都能下載，備份裡是全部資料表，所以倉庫不是私有就直接停下。
      - name: 確認倉庫是私有的
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::倉庫目前是公開的，備份會被任何人下載。請先到 Settings → General → Danger Zone 改成 Private。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 匯出各資料表為 JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node .github/scripts/backup-export.mjs

      - name: 打包並建立 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          ZIP="freight-ops-backup-$DATE.zip"
          cd backup-out
          zip -r "../$ZIP" .
          cd ..
          gh release create "backup-$DATE-$GITHUB_RUN_NUMBER" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "資料庫備份 $DATE" \
            --notes "GitHub Actions 每週自動備份，內含全部資料表 JSON 與 manifest.json（各表筆數、Storage 檔案數）。"

      # 只留最近 8 份（約兩個月），更舊的連同 tag 一起刪掉，避免資料副本越堆越多。
      - name: 清掉舊備份
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("backup-"))] | sort_by(.createdAt) | reverse | .[8:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
