# 一次性：刪除倉庫公開期間留下的所有 backup-* 備份 release 與 tag。
# 只能手動觸發，且要輸入 DELETE 才會執行。用完會在下一個 PR 移除。
name: 刪除公開備份（一次性）

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '輸入 DELETE 確認刪除全部 backup-* release（不能復原）'
        required: true

permissions:
  contents: write

jobs:
  purge:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - name: 刪除所有 backup-* release 與 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '.[] | select(.tagName | startswith("backup-")) | .tagName')
          echo "要刪除的備份："
          echo "$tags"
          for tag in $tags; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "已刪除 $tag"
          done
          left=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '[.[] | select(.tagName | startswith("backup-"))] | length')
          echo "剩下 backup-* release：$left"
          test "$left" -eq 0
