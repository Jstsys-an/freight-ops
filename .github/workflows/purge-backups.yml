# 一次性：刪除倉庫公開期間留下的 5 份備份 release 與 tag。
# 只能手動觸發，且要輸入 DELETE 才會執行。用完會在下一個 PR 移除。
name: 刪除公開備份（一次性）

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '輸入 DELETE 確認刪除公開期間的 5 份備份（不能復原）'
        required: true

permissions:
  contents: write

jobs:
  purge:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      # 只刪倉庫公開期間產生的這 5 份；改成私有後產生的新備份不受影響。
      - name: 刪除公開期間的 5 份備份 release 與 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          for tag in backup-2026-09-17-1 backup-2026-09-20-2 backup-2026-09-27-3 backup-2026-10-04-4 backup-2026-10-11-5; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "已刪除 $tag"
            else
              echo "$tag 已不存在，略過"
            fi
          done
