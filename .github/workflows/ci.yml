# PR 與 main 的快速檢查：前端 JS 語法、備份腳本語法、slack-bridge 單元測試。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 語法檢查
        run: |
          for f in js/*.js .github/scripts/*.mjs; do
            node --check "$f"
          done

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: slack-bridge 單元測試
        run: deno test supabase/functions/slack-bridge/lib_test.ts supabase/functions/slack-bridge/verify_test.ts
